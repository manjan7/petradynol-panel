name: Petradynol Panel Keep-Alive

# Runs the Pterodactyl panel on a GitHub Actions runner, using Google Drive
# to persist the MySQL database dump between the 5-hour runs.

on:
  schedule:
    - cron: '2 */5 * * *'
  workflow_dispatch:

concurrency:
  group: petradynol-panel-test3
  cancel-in-progress: true

jobs:
  panel:
    name: Run Pterodactyl Panel
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      db:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: pterodactyl
          MYSQL_DATABASE: panel
          MYSQL_USER: pterodactyl
          MYSQL_PASSWORD: pterodactyl
        ports:
          - 3306:3306
      cache:
        image: redis:7.4
        ports:
          - 6379:6379

    env:
      PANEL_PORT: 80
      SERVER_HEALTH_URL: http://localhost/
      DRIVE_REMOTE: ${{ vars.DRIVE_REMOTE || 'gdrive:petradynol' }}
      DB_DIR: ${{ vars.DB_DIR || './data' }}
      DB_NAME: panel
      DB_USER: pterodactyl
      DB_PASS: pterodactyl
      APP_URL: http://localhost

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare log file
        run: touch panel.log

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Install cloudflared (free tunnel)
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Configure rclone (Google Drive)
        env:
          RCLONE_CONFIG_B64: ""
        run: |
          mkdir -p ~/.config/rclone
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "::error::RCLONE_CONFIG_B64 secret is required."
            exit 1
          fi
          echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Wait for database to be ready
        run: |
          for i in $(seq 1 60); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',3306)); s.close(); sys.exit(0)" 2>/dev/null; then
              echo "Database port is open."
              sleep 5
              break
            fi
            sleep 2
          done

      # 2-minute gap after the previous run stopped before starting a new one.
      - name: Wait 2 minutes (gap after previous run)
        run: sleep 120

      - name: Pull database dump from Drive
        run: |
          mkdir -p "$DB_DIR"
          rclone mkdir "$DRIVE_REMOTE/db" 2>/dev/null || true
          rclone sync "$DRIVE_REMOTE/db" "$DB_DIR" --verbose --timeout 120s --contimeout 30s --retries 2 || true

      - name: Generate APP_KEY
        run: |
          KEY="base64:$(openssl rand -base64 32)"
          echo "APP_KEY=$KEY" >> "$GITHUB_ENV"
          echo "Generated APP_KEY."

      - name: Restore database from dump (if present)
        run: |
          if [ -f "$DB_DIR/panel.sql" ]; then
            echo "Restoring database from dump..."
            for i in $(seq 1 30); do
              if docker exec db mariadb -u"$DB_USER" -p"$DB_PASS" -e "SELECT 1" "$DB_NAME" >/dev/null 2>&1; then break; fi
              sleep 2
            done
            docker exec -i db mariadb -u"$DB_USER" -p"$DB_PASS" "$DB_NAME" < "$DB_DIR/panel.sql" || echo "Restore failed; continuing with fresh DB."
          else
            echo "No existing dump; starting fresh."
          fi

      - name: Start Pterodactyl panel (Docker)
        timeout-minutes: 5
        run: |
          docker pull ghcr.io/pterodactyl/panel:latest
          docker run -d --name panel --network host \
            -e APP_URL="$APP_URL" \
            -e APP_KEY="$APP_KEY" \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE="$DB_NAME" \
            -e DB_USERNAME="$DB_USER" \
            -e DB_PASSWORD="$DB_PASS" \
            -e CACHE_DRIVER=redis \
            -e SESSION_DRIVER=redis \
            -e QUEUE_CONNECTION=redis \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e MAIL_MAILER=log \
            ghcr.io/pterodactyl/panel:latest
          echo "PANEL_CONTAINER=panel" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 "$SERVER_HEALTH_URL" >/dev/null; then
              echo "Panel is up."
              break
            fi
            sleep 5
          done

      - name: Create admin user (first run only)
        run: |
          docker exec panel php artisan p:user:make --email=admin@example.com --username=admin --firstname=Admin --lastname=User --password=adminpassword --admin=1 2>&1 | tail -5 || echo "Admin creation skipped/failed (may already exist)."
          echo "=========================================="
          echo "Admin login: admin@example.com / adminpassword"
          echo "=========================================="

      - name: Expose panel via Cloudflare Tunnel (free public URL)
        run: |
          nohup /tmp/cloudflared tunnel --url "http://localhost:${PANEL_PORT}" > cloudflared.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n1)
            if [ -n "$URL" ]; then
              echo "=========================================="
              echo "Public panel URL: $URL"
              echo "=========================================="
              echo "PANEL_PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              break
            fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tunnel URL not found yet; cloudflared.log:"
            cat cloudflared.log || true
          fi

      - name: Keep panel alive (sync DB to Drive every minute)
        timeout-minutes: 295
        run: |
          END=$((SECONDS + 290*60))
          while [ $SECONDS -lt $END ]; do
            sleep 60
            mkdir -p "$DB_DIR"
            docker exec db mariadb-dump -u"$DB_USER" -p"$DB_PASS" "$DB_NAME" > "$DB_DIR/panel.sql" 2>/dev/null || true
            rclone mkdir "$DRIVE_REMOTE/db" 2>/dev/null || true
            rclone sync "$DB_DIR" "$DRIVE_REMOTE/db" --verbose --timeout 120s --contimeout 30s --retries 2 || true
            if ! curl -sf --max-time 10 "$SERVER_HEALTH_URL" >/dev/null; then
              echo "Panel died; restarting container..."
              docker restart panel || true
              sleep 15
            fi
          done

      - name: Final DB sync to Drive
        if: always()
        run: |
          mkdir -p "$DB_DIR"
          docker exec db mariadb-dump -u"$DB_USER" -p"$DB_PASS" "$DB_NAME" > "$DB_DIR/panel.sql" 2>/dev/null || true
          rclone mkdir "$DRIVE_REMOTE/db" 2>/dev/null || true
          rclone sync "$DB_DIR" "$DRIVE_REMOTE/db" --verbose --timeout 120s --contimeout 30s --retries 2 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petradynol-logs-${{ github.run_id }}
          path: |
            panel.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 3
