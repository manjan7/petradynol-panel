name: Petradynol Panel Keep-Alive

# Installs the Pterodactyl panel on a GitHub Actions runner using the
# standalone non-interactive installer, and uses Google Drive to persist
# the MySQL database dump between the 5-hour runs.

on:
  schedule:
    - cron: '2 */5 * * *'
  workflow_dispatch:

concurrency:
  group: petradynol-panel
  cancel-in-progress: false

jobs:
  panel:
    name: Run Pterodactyl Panel
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      PANEL_PORT: 80
      SERVER_HEALTH_URL: http://localhost/
      DRIVE_REMOTE: ${{ vars.DRIVE_REMOTE || 'gdrive:petradynol' }}
      DB_DIR: ${{ vars.DB_DIR || './data' }}
      DB_NAME: panel
      DB_USER: pterodactyl
      DB_PASS: pterodactyl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare log file
        run: touch panel.log

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Install cloudflared (free tunnel)
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Configure rclone (Google Drive)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "::error::RCLONE_CONFIG_B64 secret is required."
            exit 1
          fi
          echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Wait 2 minutes (gap after previous run)
        run: sleep 120

      - name: Check Drive for existing backup
        run: |
          mkdir -p "$DB_DIR"
          rclone mkdir "$DRIVE_REMOTE/db" 2>/dev/null || true
          if rclone ls "$DRIVE_REMOTE/db" 2>/dev/null | grep -q .; then
            echo "BACKUP FOUND on Drive -> will restore."
            echo "HAS_BACKUP=true" >> "$GITHUB_ENV"
          else
            echo "NO BACKUP on Drive -> fresh install."
            echo "HAS_BACKUP=false" >> "$GITHUB_ENV"
          fi

      - name: Pull database dump from Drive
        run: |
          mkdir -p "$DB_DIR"
          rclone sync "$DRIVE_REMOTE/db" "$DB_DIR" --verbose --timeout 120s --contimeout 30s --retries 2 || true
          echo "DB_DIR contents:"
          ls -la "$DB_DIR" || true

      - name: Install Pterodactyl panel (non-interactive)
        timeout-minutes: 30
        env:
          FQDN: localhost
          email: admin@example.com
          user_email: admin@example.com
          user_username: admin
          user_firstname: Admin
          user_lastname: User
          user_password: adminpassword
          MYSQL_DB: panel
          MYSQL_USER: pterodactyl
          MYSQL_PASSWORD: pterodactyl
          ASSUME_SSL: "false"
          CONFIGURE_LETSENCRYPT: "false"
          CONFIGURE_FIREWALL: "false"
          timezone: UTC
          telemetry: "false"
        run: |
          curl -fsSL -o /tmp/install-petradynol-panel.sh \
            https://raw.githubusercontent.com/manjan7/petradynol-panel/main/install-petradynol-panel.sh
          chmod +x /tmp/install-petradynol-panel.sh
          sudo bash /tmp/install-petradynol-panel.sh
          echo "Pterodactyl panel installed."

      - name: Fix APP_KEY (keep consistent across runs)
        run: |
          FIXED_KEY="base64:$(printf 'pterodactyl-panel-fixed-key-32bytes!' | base64 -w0)"
          if [ -f /var/www/pterodactyl/.env ]; then
            sudo sed -i "s@^APP_KEY=.*@APP_KEY=$FIXED_KEY@" /var/www/pterodactyl/.env
            cd /var/www/pterodactyl && sudo -u www-data php artisan config:clear || true
          fi
          echo "APP_KEY set."

      - name: Restore database from dump (if backup exists)
        run: |
          if [ "$HAS_BACKUP" = "true" ] && [ -f "$DB_DIR/panel.sql" ]; then
            echo "Restoring database from backup dump..."
            for i in $(seq 1 30); do
              if mariadb -h 127.0.0.1 -P 3306 -u"$DB_USER" -p"$DB_PASS" -e "SELECT 1" "$DB_NAME" >/dev/null 2>&1; then break; fi
              sleep 2
            done
            mariadb -h 127.0.0.1 -P 3306 -u"$DB_USER" -p"$DB_PASS" "$DB_NAME" < "$DB_DIR/panel.sql" && echo "Restore complete." || echo "Restore failed; using fresh DB."
          else
            echo "No backup to restore; using fresh DB from install."
          fi

      - name: Ensure services are running
        run: |
          sudo systemctl enable --now mariadb 2>/dev/null || true
          sudo systemctl enable --now redis-server 2>/dev/null || true
          sudo systemctl enable --now php8.3-fpm 2>/dev/null || true
          sudo systemctl enable --now nginx 2>/dev/null || true
          sudo systemctl enable --now cron 2>/dev/null || true
          sudo systemctl enable --now pteroq 2>/dev/null || true
          sleep 5
          echo "Services status:"
          sudo systemctl is-active mariadb nginx php8.3-fpm redis-server 2>&1 || true

      - name: Expose panel via Cloudflare Tunnel (free public URL)
        run: |
          nohup /tmp/cloudflared tunnel --url "http://localhost:${PANEL_PORT}" > cloudflared.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\\.trycloudflare\\.com' cloudflared.log | head -n1)
            if [ -n "$URL" ]; then
              echo "=========================================="
              echo "Public panel URL: $URL"
              echo "Admin login: admin@example.com / adminpassword"
              echo "=========================================="
              echo "PANEL_PUBLIC_URL=$URL" >> "$GITHUB_ENV"
              break
            fi
            sleep 2
          done

      - name: Debug panel status before keepalive
        run: |
          echo "=== HTTP HEAD ==="
          curl -I --max-time 20 http://localhost/ || true
          echo "=== nginx status ==="
          sudo systemctl status nginx php8.3-fpm --no-pager || true
          echo "=== nginx error log ==="
          sudo tail -n 100 /var/log/nginx/error.log || true
          echo "=== php-fpm error log ==="
          sudo tail -n 100 /var/log/php8.3-fpm/error.log || true
          if [ -f /var/www/pterodactyl/artisan ]; then
            echo "=== Laravel status ==="
            sudo -u www-data php /var/www/pterodactyl/artisan up || true
          fi

      - name: Keep panel alive (health checks only)
        timeout-minutes: 280
        run: |
          # Run ~280 min, leaving ~20 min buffer before the 300-min cap.
          # We intentionally avoid syncing to Drive every minute because it causes
          # service churn and unnecessary file I/O during the run.
          END=$((SECONDS + 280*60))
          while [ $SECONDS -lt $END ]; do
            if curl -fsS --max-time 10 "$SERVER_HEALTH_URL" >/dev/null; then
              echo "Panel healthy."
            else
              echo "Panel health check failed; dumping service state before restart..."
              sudo systemctl status nginx php8.3-fpm --no-pager || true
              sudo tail -n 100 /var/log/nginx/error.log || true
              sudo tail -n 100 /var/log/php8.3-fpm/error.log || true
              if [ -f /var/www/pterodactyl/artisan ]; then
                sudo -u www-data php /var/www/pterodactyl/artisan config:clear || true
              fi
              sudo systemctl restart nginx php8.3-fpm || true
              sleep 15
            fi
            sleep 300
          done

      - name: Stop services and final backup to Drive (~15 min before cap)
        if: always()
        run: |
          echo "Dumping final database state..."
          mkdir -p "$DB_DIR"
          mariadb-dump -h 127.0.0.1 -P 3306 -u"$DB_USER" -p"$DB_PASS" "$DB_NAME" > "$DB_DIR/panel.sql" 2>/dev/null || true
          rclone mkdir "$DRIVE_REMOTE/db" 2>/dev/null || true
          rclone sync "$DB_DIR" "$DRIVE_REMOTE/db" --verbose --timeout 120s --contimeout 30s --retries 2 || true
          echo "Final backup complete. Next run will restore from Drive."
          systemctl stop pteroq nginx php8.3-fpm mariadb redis-server 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petradynol-logs-${{ github.run_id }}
          path: |
            panel.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 3
